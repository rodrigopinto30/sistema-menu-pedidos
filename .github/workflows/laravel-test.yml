name: Laravel CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: menu_db_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: actions/checkout@v4
      - name: Copy .env
        run: php -r "file_exists('backend/.env') || copy('backend/.env.example', 'backend/.env');"
      - name: Install Dependencies
        run: cd backend && composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      - name: Generate key
        run: cd backend && php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 backend/storage backend/bootstrap/cache
      - name: Run Migrations
        run: cd backend && php artisan migrate --env=testing
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: menu_db_test
          DB_USERNAME: root
          DB_PASSWORD: root
      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: cd backend && php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: menu_db_test
          DB_USERNAME: root
          DB_PASSWORD: root
